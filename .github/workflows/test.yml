name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ledger, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test (race + coverage)
        run: go test -race -cover -coverprofile=cover.out ./...

      - name: Total coverage
        run: |
          TOTAL=$(go tool cover -func=cover.out | tail -n 1)
          echo "$TOTAL"
          echo "### Coverage ${{ matrix.module }}: $TOTAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: cover-${{ matrix.module }}
          path: ${{ matrix.module }}/cover.out
